<style>
    .pwd-open-btn,
    .pwd-submit-btn,
    .pwd-cancel-btn {
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font: inherit;
        cursor: pointer;
    }

    .pwd-open-btn,
    .pwd-submit-btn {
        color: #fff;
        background: #2563eb;
    }

    .pwd-dialog {
        width: min(420px, calc(100% - 32px));
        padding: 0;
        border: 0;
        border-radius: 14px;
        box-shadow: 0 20px 55px rgba(15, 23, 42, 0.25);
    }

    .pwd-dialog::backdrop {
        background: rgba(15, 23, 42, 0.45);
    }

    .pwd-form {
        padding: 28px;
    }

    .pwd-form h2 {
        margin: 0 0 22px;
        color: #1e3a8a;
        font-size: 22px;
    }

    .pwd-field {
        margin-bottom: 16px;
    }

    .pwd-field label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
    }

    .pwd-field input {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        font: inherit;
    }

    .pwd-field input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .pwd-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
    }

    .pwd-cancel-btn {
        color: #334155;
        background: #e2e8f0;
    }
</style>

<button class="pwd-open-btn" type="button" onclick="passwordDialog.showModal()">
    修改密码
</button>

<dialog class="pwd-dialog" id="passwordDialog">
    <form
        class="pwd-form"
        method="post"
        action="{{ url_for('auth.change_pwd', user_id=current_user.id) }}"
    >
        <h2>修改密码</h2>

        {% if return_pid is defined and return_pid %}
            <input type="hidden" name="pid" value="{{ return_pid }}">
        {% endif %}

        <div class="pwd-field">
            <label for="old_pwd">旧密码</label>
            <input
                id="old_pwd"
                name="old_pwd"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="pwd-field">
            <label for="new_pwd">新密码</label>
            <input
                id="new_pwd"
                name="new_pwd"
                type="password"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="pwd-field">
            <label for="confirm_pwd">确认新密码</label>
            <input
                id="confirm_pwd"
                name="confirm_pwd"
                type="password"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="pwd-actions">
            <button
                class="pwd-cancel-btn"
                type="button"
                onclick="passwordDialog.close()"
            >
                取消
            </button>
            <button class="pwd-submit-btn" type="submit">确认修改</button>
        </div>
    </form>
</dialog>
