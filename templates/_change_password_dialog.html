<link rel="stylesheet" href="{{ url_for('static', filename='css/change_password.css') }}">

<button class="pwd-open-btn" type="button" onclick="passwordDialog.showModal()">
    修改密码
</button>

<dialog class="pwd-dialog" id="passwordDialog">
    <form
        class="pwd-form"
        method="post"
        action="{{ url_for('auth.change_pwd', user_id=current_user.id) }}"
    >
        <h2>修改密码</h2>

        {% if return_pid is defined and return_pid %}
            <input type="hidden" name="pid" value="{{ return_pid }}">
        {% endif %}

        <div class="pwd-field">
            <label for="old_pwd">旧密码</label>
            <input
                id="old_pwd"
                name="old_pwd"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="pwd-field">
            <label for="new_pwd">新密码</label>
            <input
                id="new_pwd"
                name="new_pwd"
                type="password"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="pwd-field">
            <label for="confirm_pwd">确认新密码</label>
            <input
                id="confirm_pwd"
                name="confirm_pwd"
                type="password"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="pwd-actions">
            <button
                class="pwd-cancel-btn"
                type="button"
                onclick="passwordDialog.close()"
            >
                取消
            </button>
            <button class="pwd-submit-btn" type="submit">确认修改</button>
        </div>
    </form>
</dialog>
