<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 项目材料管理系统</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1f2937;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 55%, #eef2ff 100%);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 38px 36px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 18px 50px rgba(30, 64, 175, 0.12);
        }

        .login-card h1 {
            margin: 0 0 8px;
            color: #1e3a8a;
            font-size: 26px;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #64748b;
            font-size: 14px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .flash-message {
            margin-bottom: 18px;
            padding: 10px 12px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #b91c1c;
            font-size: 14px;
            background: #fef2f2;
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 4px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #2563eb;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: translateY(1px);
        }

        .footer {
            margin: 22px 0 0;
            color: #94a3b8;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>项目材料管理系统</h1>
        <p class="subtitle">请输入账号和密码登录</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="请输入用户名"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="请输入密码"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">登 录</button>
        </form>

        <p class="footer">请使用系统分配的账号登录</p>
    </main>
</body>
</html>
