<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 个人项目管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <main class="login-card">
        <h1>个人项目管理</h1>
        <p class="subtitle">请输入账号和密码登录</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="请输入用户名"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="请输入密码"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">登 录</button>
        </form>

        <section class="register-section" aria-label="注册入口">
            <span>还没有账号？选择账号类型注册</span>
            <div class="register-options">
                <a class="register-link" href="{{ url_for('auth.register', role='主管') }}">主管注册</a>
                <a class="register-link" href="{{ url_for('auth.register', role='普通用户') }}">普通用户注册</a>
            </div>
        </section>

        <p class="footer">请使用系统分配的账号登录</p>
    </main>
</body>
</html>
